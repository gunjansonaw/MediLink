# Rendered by the nginx image's envsubst step: ${BACKEND_UPSTREAM} comes from the
# environment (docker-compose: http://backend:8000, Kubernetes: the backend Service).
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml application/json image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Health check endpoint (used by Kubernetes probes)
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'OK';
    }

    # Reverse proxy API requests to the Django backend. Same-origin => the
    # HttpOnly JWT cookies and CSRF cookie just work.
    location /api/ {
        proxy_pass ${BACKEND_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # AI agent turns can run for a while
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # Django admin + its static files (Django uses /django-static/ so it can't
    # collide with the React build's /static/ directory).
    location ^~ /admin/ {
        proxy_pass ${BACKEND_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
    location ^~ /django-static/ {
        proxy_pass ${BACKEND_UPSTREAM};
        proxy_set_header Host $host;
    }
    location ^~ /swagger/ {
        proxy_pass ${BACKEND_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Hashed React build assets: cache forever
    location ^~ /static/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Frontend Single-Page Application (SPA) routing; never cache index.html
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri $uri/ /index.html;
    }
}
