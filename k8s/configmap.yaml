apiVersion: v1
kind: ConfigMap
metadata:
  name: medilink-config
  namespace: medilink
data:
  DB_HOST: postgres
  DB_PORT: "5432"
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  CORS_ALLOWED_ORIGINS: http://localhost:3000
  CSRF_TRUSTED_ORIGINS: http://localhost:3000
  COOKIE_DOMAIN: ""
