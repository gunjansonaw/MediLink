# Loads the demo accounts/data once (idempotent). Re-run with:
#   kubectl -n medilink delete job seed-demo-data && kubectl apply -k deploy/k8s/overlays/local
apiVersion: batch/v1
kind: Job
metadata:
  name: seed-demo-data
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seed-demo-data
        medilink.io/db-client: "true"
    spec:
      restartPolicy: OnFailure
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: seed
          image: medilink-backend
          # Wait until the backend's initContainer has applied migrations
          command:
            - sh
            - -c
            - >-
              python manage.py wait_for_db --timeout 300 &&
              until python manage.py migrate --check >/dev/null 2>&1; do echo waiting for migrations; sleep 5; done &&
              python manage.py seed_demo_data
          envFrom:
            - configMapRef: {name: medilink-config}
            - secretRef: {name: medilink-secrets}
          env:
            - {name: CELERY_TASK_ALWAYS_EAGER, value: "True"}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
