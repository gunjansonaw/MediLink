apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels: {app.kubernetes.io/name: frontend, app.kubernetes.io/part-of: medilink}
spec:
  selector: {app.kubernetes.io/name: frontend}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels: {app.kubernetes.io/name: frontend, app.kubernetes.io/part-of: medilink}
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels: {app.kubernetes.io/name: frontend}
  template:
    metadata:
      labels: {app.kubernetes.io/name: frontend, app.kubernetes.io/part-of: medilink}
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: frontend
          image: medilink-frontend
          ports:
            - {name: http, containerPort: 8080}
          env:
            # nginx proxies /api, /admin and /django-static to the backend Service.
            # It resolves the name at request time with its own resolver, which
            # ignores resolv.conf search domains, so this must be fully qualified.
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - {name: BACKEND_UPSTREAM, value: "http://backend.$(POD_NAMESPACE).svc.cluster.local:8000"}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
