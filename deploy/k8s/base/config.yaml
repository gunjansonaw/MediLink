# Non-secret configuration. Overlays patch the host-specific values.
# Secrets (SECRET_KEY, DB_PASSWORD, ANTHROPIC_API_KEY) come from the
# `medilink-secrets` Secret generated by each overlay.
apiVersion: v1
kind: ConfigMap
metadata:
  name: medilink-config
data:
  DEBUG: "False"
  DB_NAME: medilink
  DB_USER: medilink
  DB_HOST: postgres
  DB_PORT: "5432"
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0
  # Public hostname(s) of the app; "localhost" is needed for kubelet probes
  ALLOWED_HOSTS: medilink.example.com,localhost,backend
  CSRF_TRUSTED_ORIGINS: https://medilink.example.com
  CORS_ALLOWED_ORIGINS: https://medilink.example.com
  COOKIE_SECURE: "True"
  SECURE_HSTS_SECONDS: "0"
  AI_ENABLED: "True"
  AI_MODEL: claude-opus-5-5
  AI_EFFORT: medium
  AI_RATE_LIMIT: 30/hour
  LOG_LEVEL: INFO
