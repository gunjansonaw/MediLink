apiVersion: v1
kind: Service
metadata:
  # The frontend's BACKEND_UPSTREAM (frontend.yaml) points at this Service by name
  name: backend
  labels: {app.kubernetes.io/name: backend, app.kubernetes.io/part-of: medilink}
spec:
  selector: {app.kubernetes.io/name: backend}
  ports:
    - {name: http, port: 8000, targetPort: http}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media
  labels: {app.kubernetes.io/part-of: medilink}
spec:
  # RWO is fine on a single-node cluster (k3s on one VM). For multi-node
  # clusters use an RWX storage class or object storage for uploads.
  accessModes: ["ReadWriteOnce"]
  resources:
    requests: {storage: 2Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels: {app.kubernetes.io/name: backend, app.kubernetes.io/part-of: medilink}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels: {app.kubernetes.io/name: backend}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: medilink
        medilink.io/db-client: "true"
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        # Migrations run once per rollout, before the new pod takes traffic
        - name: migrate
          image: medilink-backend
          command: ["sh", "-c", "python manage.py wait_for_db --timeout 180 && python manage.py migrate --noinput"]
          envFrom:
            - configMapRef: {name: medilink-config}
            - secretRef: {name: medilink-secrets}
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      containers:
        - name: backend
          image: medilink-backend
          ports:
            - {name: http, containerPort: 8000}
          envFrom:
            - configMapRef: {name: medilink-config}
            - secretRef: {name: medilink-secrets}
          env:
            - {name: RUN_MIGRATIONS, value: "0"}
          startupProbe:
            httpGet: {path: /api/health/, port: http, httpHeaders: [{name: Host, value: localhost}]}
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: {path: /api/ready/, port: http, httpHeaders: [{name: Host, value: localhost}]}
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /api/health/, port: http, httpHeaders: [{name: Host, value: localhost}]}
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests: {cpu: 200m, memory: 384Mi}
            limits: {memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: media, mountPath: /app/media}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: media
          persistentVolumeClaim: {claimName: media}
